MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'vit_base_patch16_dinov3.lvd1689m'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'dinov3'
  STRIDE_SIZE: [16, 16]
  USE_AMP: True
  MIE: False
  MIE_COE: 3.0
  SSE: False
  PAIR: False

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN_RGB: [0.485, 0.456, 0.406]
  PIXEL_STD_RGB: [0.229, 0.224, 0.225]
  PIXEL_MEAN_SAR: [0.104543, 0.104543, 0.104543]
  PIXEL_STD_SAR: [0.179554, 0.179554, 0.179554]

DATASETS:
  NAMES: ('HOSS')
  ROOT_DIR: ('/nfs/h100/raid/rs/vessel_detection')
  EVAL_MODE: 'all'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 300
  BASE_LR: 0.00005
  IMS_PER_BATCH: 32
  WARMUP_METHOD: 'linear'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 200
  LOG_PERIOD: 80
  EVAL_PERIOD: 1
  TRACK_VALIDATION_METRICS: True
  TRACK_VALIDATION_METRICS_OPTISAR: True
  PRETRAIN_TRACK_VALIDATION_DIR: '/nfs/dgx/raid/rs/rs/vessel_re_id/'
  SEED: 42
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/hoss_dino'

WANDB:
  PROJECT: 'vessel-reidentification'
  NAME: 'dino'
