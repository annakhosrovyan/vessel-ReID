MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'vit_base_patch16_dinov3.lvd1689m'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'dinov3'
  STRIDE_SIZE: [16, 16]
  MIE: True
  MIE_COE: 3.0
  SSE: False
  PAIR: True
  DIST_TRAIN: True
  METRIC_LOSS_TYPE: 'clip' 

INPUT:
  SIZE_TRAIN: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: ('Pretrain')
  ROOT_DIR: ('/nfs/dgx/raid/rs/rs/vessel_re_id/')

DATALOADER:
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 60
  BASE_LR: 0.003
  IMS_PER_BATCH: 512
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  SCHEDULER_TYPE: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  EVAL_PERIOD: 1
  TRACK_VALIDATION_METRICS: True
  LOG_PERIOD: 100
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 42

OUTPUT_DIR: '/nfs/dgx/raid/rs/rs/vessel_re_id/checkpoints/pretrain_dino_v3'

WANDB:
  PROJECT: 'vessel-reid-pretraining'
  NAME: 'pretrain-dino'