MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: '/data/ship/weights/vit_b512_pre.pth'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransOSS'
  STRIDE_SIZE: [16, 16]
  MIE: True
  MIE_COE: 3.0
  SSE: False
  PAIR: True
  DIST_TRAIN: True
  METRIC_LOSS_TYPE: 'clip' 

INPUT:
  SIZE_TRAIN: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN_RGB: [0.485, 0.456, 0.406]
  PIXEL_STD_RGB: [0.229, 0.224, 0.225]
  PIXEL_MEAN_SAR: [0.340619, 0.340619, 0.340619]
  PIXEL_STD_SAR: [0.276758, 0.276758, 0.276758]

DATASETS:
  NAMES: ('Pretrain')
  ROOT_DIR: ('/data/ship/vessel_re_id/')

DATALOADER:
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 60
  BASE_LR: 0.003
  IMS_PER_BATCH: 512
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  SCHEDULER_TYPE: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  EVAL_PERIOD: 1
  TRACK_VALIDATION_METRICS: True
  LOG_PERIOD: 100
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  SEED: 42
  PRETRAIN_TRACK_VALIDATION_DIR: '/data/ship/vessel_re_id/'


OUTPUT_DIR: '/data/ship/vessel_re_id/checkpoints/pretrain_transoss'

WANDB:
  PROJECT: 'vessel-reid-pretraining'
  NAME: 'pretrain-transoss'